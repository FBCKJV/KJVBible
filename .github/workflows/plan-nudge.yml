name: Daily Reading Reminder

# Only people who asked for a reminder get one. The app tags their device's
# OneSignal subscription with plan_nudge = morning | midday | evening and
# next_reading = their next chapter(s) ("Proverbs 5 · Matthew 23"). This sends
# one notification per time of day to just those tags, and OneSignal delivers
# it at that hour in each person's OWN timezone (delayed_option=timezone),
# putting their next reading into the message from the tag.
on:
  schedule:
    # 10:00 UTC, the same as the Verse of the Day: early enough that 7 AM
    # still falls on the same calendar day across the US.
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Send morning, midday and evening reminders
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          ONESIGNAL_APP_ID: "2899d3fb-9085-48be-8d7f-a315e564ecda"
        run: |
          send () {
            SLOT="$1"; TIME="$2"
            BODY=$(jq -n --arg app "$ONESIGNAL_APP_ID" --arg slot "$SLOT" --arg time "$TIME" '{
              app_id: $app,
              filters: [{field: "tag", key: "plan_nudge", relation: "=", value: $slot}],
              headings: {en: "📖 Time in the Word"},
              contents: {en: "Next in your reading plan: {{ next_reading | default: \"your reading for today\" }}"},
              url: "https://fbckjv.app/KJVBible/?open=plans",
              chrome_web_icon: "https://fbckjv.app/KJVBible/apple-touch-icon.png",
              delayed_option: "timezone",
              delivery_time_of_day: $time,
              ttl: 43200
            }')
            HTTP_STATUS=$(curl -s -o /tmp/os_resp.json -w "%{http_code}" \
              -X POST "https://onesignal.com/api/v1/notifications" \
              -H "Authorization: Basic $ONESIGNAL_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$BODY")
            echo "$SLOT ($TIME) → $HTTP_STATUS"; cat /tmp/os_resp.json; echo
            # 200 with no recipients just means nobody has picked this time yet
            if [ "$HTTP_STATUS" != "200" ]; then return 1; fi
          }
          FAIL=0
          send morning "7:00AM"  || FAIL=1
          send midday  "12:00PM" || FAIL=1
          send evening "7:00PM"  || FAIL=1
          exit $FAIL
