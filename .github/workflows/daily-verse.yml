name: Daily Verse of the Day

on:
  schedule:
    # Fire at 10:00 UTC (early morning across the US), then let OneSignal
    # deliver at 8:00 AM in each subscriber's OWN timezone via
    # delayed_option=timezone. Sending before 8 AM Eastern guarantees the
    # verse still goes out the same calendar day for every US timezone.
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  send-verse:
    runs-on: ubuntu-latest

    steps:
      - name: Calculate today's verse and send notification
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          ONESIGNAL_APP_ID: "2899d3fb-9085-48be-8d7f-a315e564ecda"
        run: |
          # Match app formula: VOD[(dayOfYear - 1) % 365]
          # dayOfYear = 1 on Jan 1, 365 on Dec 31
          DAY_OF_YEAR=$(date +%-j)
          VOD_COUNT=365
          IDX=$(( (DAY_OF_YEAR - 1) % VOD_COUNT ))

          BOOKS=("John" "Romans" "Romans" "Romans" "Acts" "Acts" "Ephesians" "Titus" "1 Timothy" "1 Corinthians" "John" "Romans" "Proverbs" "Psalms" "Isaiah" "Hebrews" "Hebrews" "Psalms" "Psalms" "Matthew" "Philippians" "Romans" "Joshua" "Deuteronomy" "Jeremiah" "Matthew" "Luke" "1 Thessalonians" "Psalms" "James" "Psalms" "Psalms" "John" "Colossians" "Psalms" "Acts" "Romans" "Galatians" "Galatians" "Ephesians" "Philippians" "Colossians" "1 Peter" "James" "Matthew" "1 Corinthians" "Micah" "2 Timothy" "Psalms" "Psalms" "Isaiah" "John" "Romans" "2 Corinthians" "Hebrews" "1 Peter" "Lamentations" "Revelation" "Psalms" "Nahum" "Jeremiah" "Psalms" "Isaiah" "Philippians" "2 Timothy" "Psalms" "Matthew" "1 Peter" "Psalms" "Romans" "Psalms" "Proverbs" "Psalms" "Psalms" "Ephesians" "James" "1 Corinthians" "2 Corinthians" "Galatians" "Hebrews" "Psalms" "Proverbs" "Matthew" "Colossians" "1 John" "Psalms" "Romans" "Philippians" "Psalms" "Jeremiah" "Isaiah" "Deuteronomy" "Psalms" "Proverbs" "Psalms" "1 Chronicles" "Psalms" "Psalms" "Isaiah" "Habakkuk" "Matthew" "John" "Romans" "2 Corinthians" "James" "1 John" "Psalms" "Isaiah" "Proverbs" "Psalms" "Matthew" "John" "Acts" "Romans" "Ephesians" "Philippians" "Colossians" "1 Thessalonians" "2 Timothy" "Hebrews" "1 Peter" "Revelation" "Psalms" "Proverbs" "Ecclesiastes" "Isaiah" "Jeremiah" "Lamentations" "Micah" "Zephaniah" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Proverbs" "Isaiah" "Isaiah" "Isaiah" "Isaiah" "Matthew" "Matthew" "Mark" "Luke" "John" "John" "John" "John" "Acts" "Romans" "Romans" "1 Corinthians" "1 Corinthians" "2 Corinthians" "Galatians" "Ephesians" "Philippians" "Colossians" "1 Timothy" "2 Timothy" "Hebrews" "James" "1 Peter" "1 John" "Revelation" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Proverbs" "Proverbs" "Isaiah" "Jeremiah" "Matthew" "Matthew" "Luke" "John" "John" "Romans" "1 Corinthians" "2 Corinthians" "Galatians" "Ephesians" "Philippians" "Colossians" "1 Thessalonians" "2 Timothy" "Hebrews" "James" "1 Peter" "2 Peter" "1 John" "Jude" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Psalms" "Proverbs" "Proverbs" "Proverbs" "Proverbs" "Proverbs" "Proverbs" "Proverbs" "Proverbs" "Proverbs" "Proverbs" "Proverbs" "Proverbs" "Proverbs" "Proverbs" "Proverbs" "Proverbs" "Proverbs" "Proverbs" "Proverbs" "Proverbs" "Proverbs" "Proverbs" "Isaiah" "Isaiah" "Isaiah" "Isaiah" "Isaiah" "Isaiah" "Isaiah" "Isaiah" "Isaiah" "Isaiah" "Isaiah" "Isaiah" "Isaiah" "Isaiah" "Isaiah" "Isaiah" "Isaiah" "Isaiah" "Isaiah" "Isaiah" "Isaiah" "Isaiah" "Isaiah" "Isaiah" "Jeremiah" "Jeremiah" "Jeremiah" "Ezekiel" "Daniel" "Daniel" "Hosea" "Joel" "Joel" "Amos" "Jonah" "Micah" "Habakkuk" "Zechariah" "Malachi" "Malachi" "Matthew" "Matthew" "Matthew" "Matthew" "Matthew" "Matthew" "Matthew" "Matthew" "Matthew" "Matthew" "Matthew" "Matthew" "Matthew" "Mark" "Mark" "Mark" "Luke" "Luke" "Luke" "Luke" "Luke" "Luke" "John" "John" "John" "John" "John" "John" "John" "John" "John" "John" "John" "John" "John" "John")
          CHAPTERS=(3 3 5 6 4 16 2 3 1 15 14 10 3 37 26 11 11 46 56 6 4 8 1 31 33 7 11 5 5 5 63 119 17 3 119 17 12 2 5 4 4 3 1 1 5 10 6 2 23 34 40 14 8 12 13 5 3 21 121 1 29 27 41 4 1 55 11 5 23 15 118 16 37 91 6 1 10 5 6 12 119 4 5 3 1 51 12 1 139 17 43 7 16 18 34 16 100 103 30 3 28 16 5 4 4 4 46 54 3 119 22 15 1 8 3 2 1 5 3 4 2 3 119 2 3 55 32 3 7 3 18 28 40 42 62 73 84 103 119 138 16 12 35 41 64 6 6 9 1 1 8 10 14 2 1 8 2 13 1 5 4 3 4 4 4 10 1 1 3 1 1 19 25 32 37 119 9 22 40 29 5 11 6 3 13 8 15 9 6 5 4 3 4 1 12 3 3 1 5 1 4 9 13 28 29 30 31 33 34 34 34 37 37 37 40 42 51 51 57 61 62 63 68 71 73 84 86 86 90 91 91 94 95 96 100 103 103 107 111 112 115 116 116 118 118 118 119 119 119 119 119 121 121 126 130 133 136 139 139 139 143 145 145 145 147 147 150 1 3 3 3 4 10 11 13 14 15 15 15 16 17 17 19 20 24 27 28 29 30 9 12 25 33 38 40 41 43 43 44 45 48 49 53 53 55 55 55 57 58 60 61 61 61 17 31 31 36 2 6 6 2 2 5 2 7 3 4 3 4 4 5 5 6 6 7 10 11 16 18 19 24 25 10 11 12 1 6 12 18 18 21 1 1 1 3 4 4 5 6 6 8 8 10 10 11)
          VERSES=(16 23 8 23 12 31 8 5 15 3 6 9 5 3 3 1 6 1 3 33 6 28 8 6 3 7 9 17 3 16 1 105 17 16 9 11 1 20 22 32 8 2 15 22 13 31 8 15 1 17 28 1 38 9 5 6 22 4 1 7 11 14 10 13 7 22 28 7 5 13 24 3 7 1 10 2 13 17 9 1 11 23 16 23 9 10 12 6 14 7 2 9 8 10 8 11 4 1 15 17 20 33 3 16 7 4 10 17 7 165 37 5 8 1 20 5 9 16 16 12 9 20 130 6 1 8 17 24 7 17 2 7 1 11 1 26 11 12 50 8 9 2 10 13 8 9 34 23 37 12 12 10 27 38 16 31 9 13 3 1 29 13 2 12 7 23 5 3 1 17 1 7 4 8 23 133 10 6 29 12 3 29 31 3 34 18 57 8 2 1 19 12 16 9 28 17 15 5 14 24 8 9 5 7 11 5 24 20 1 4 15 1 25 37 17 1 1 17 7 1 5 7 19 3 24 1 5 11 12 4 11 19 1 1 1 8 13 1 10 7 1 1 12 1 6 14 18 37 71 89 114 3 7 5 5 1 1 1 7 23 8 8 14 18 3 5 6 7 9 11 25 18 22 25 20 26 1 16 33 7 17 22 21 22 16 17 13 25 5 6 4 1 2 16 8 14 1 18 22 22 17 15 4 6 1 6 11 15 11 1 1 3 10 5 3 33 26 20 26 3 12 32 4 9 18 2 6 10 2 4 14 44 6 25 13 32 25 24 20 26 35 40 27 24 30 49 27 32 1 27 19 1 4 29 36 14 24 24 35 47 31 36 9 27 25)

          BOOK="${BOOKS[$IDX]}"
          CHAPTER="${CHAPTERS[$IDX]}"
          VERSE="${VERSES[$IDX]}"
          REF="$BOOK $CHAPTER:$VERSE"

          echo "Day of year: $DAY_OF_YEAR  Index: $IDX  Verse: $REF"

          # Fetch from this repo's own Bible data (same text the app shows).
          # Filenames drop spaces: "2 Timothy" -> "2Timothy.json", matching the
          # app's bookFile() convention. The previous version url-encoded the
          # space ("2%20Timothy.json"), which 404'd on every multi-word book.
          BOOK_FILE="${BOOK// /}"
          RESPONSE=$(curl -sf "https://raw.githubusercontent.com/FBCKJV/KJVBible/main/bible/${BOOK_FILE}.json" || true)

          if [ -z "$RESPONSE" ]; then echo "Failed to fetch Bible data for ${BOOK} (${BOOK_FILE}.json)"; exit 1; fi

          VERSE_TEXT=$(echo "$RESPONSE" | jq -r ".chapters[$((CHAPTER - 1))].verses[$((VERSE - 1))].text")

          if [ -z "$VERSE_TEXT" ] || [ "$VERSE_TEXT" = "null" ]; then
            echo "Could not extract verse text"; exit 1
          fi

          echo "Verse text: $VERSE_TEXT"

          HTTP_STATUS=$(curl -s -o /tmp/os_resp.json -w "%{http_code}" \
            -X POST "https://onesignal.com/api/v1/notifications" \
            -H "Authorization: Basic $ONESIGNAL_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"app_id\": \"$ONESIGNAL_APP_ID\",
              \"included_segments\": [\"All\"],
              \"headings\": {\"en\": \"$REF\"},
              \"contents\": {\"en\": \"$VERSE_TEXT\"},
              \"url\": \"https://fbckjv.app\",
              \"chrome_web_icon\": \"https://fbckjv.app/apple-touch-icon.png\",
              \"delayed_option\": \"timezone\",
              \"delivery_time_of_day\": \"8:00AM\",
              \"ttl\": 86400
            }")

          echo "OneSignal response ($HTTP_STATUS):"
          cat /tmp/os_resp.json

          if [ "$HTTP_STATUS" != "200" ]; then echo "OneSignal API error"; exit 1; fi
          echo "✓ Notification sent: $REF"
