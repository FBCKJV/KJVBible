<!doctype html><html><head><meta charset="utf-8">
<!-- The YouTube thumbnail, 1280 × 720. Its phone screens are frames of the recording:
     thumb-card.png (the John 3:16 verse card) and thumb-home.png (Home); see README. -->
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Inter:wght@600;800;900&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden}
body{background:radial-gradient(900px 700px at 78% 55%,#3a2612 0%,#1a120a 48%,#0b0705 100%);position:relative;font-family:Inter}
.rays{position:absolute;inset:0;background:radial-gradient(520px 520px at 900px 330px,rgba(236,190,110,.30),transparent 70%)}
.txt{position:absolute;left:64px;top:70px;width:640px}
.kjv{display:inline-block;font-weight:800;font-size:30px;letter-spacing:5px;color:#1a120a;background:#e2ae55;padding:10px 22px;border-radius:10px}
.free{font-weight:900;font-size:178px;line-height:.92;color:#f0bf63;margin-top:26px;letter-spacing:-3px;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.app{font-weight:900;font-size:96px;line-height:1;color:#fbf1de;letter-spacing:-1.5px;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.church{font-family:'IM Fell English';font-style:italic;font-size:58px;color:#ecd2a3;margin-top:14px}
.pills{display:flex;gap:12px;margin-top:34px}
.pills span{font-weight:700;font-size:24px;color:#fbf1de;border:2px solid rgba(226,174,85,.7);border-radius:30px;padding:9px 18px;background:rgba(0,0,0,.25)}
.ph{position:absolute;width:300px;height:649px;border-radius:40px;border:11px solid #0b0806;overflow:hidden;
  box-shadow:0 0 0 2px #6a5236,0 30px 70px rgba(0,0,0,.75)}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top}
.back{left:742px;top:92px;transform:rotate(-9deg);filter:brightness(.72)}
.front{left:930px;top:44px;transform:rotate(6deg)}
.cross{position:absolute;left:66px;bottom:44px;font-family:'IM Fell English';font-size:26px;color:#e2ae55;letter-spacing:.5px}
</style></head><body>
<div class="rays"></div>
<div class="ph back"><img src="thumb-home.png"></div>
<div class="ph front"><img src="thumb-card.png"></div>
<div class="txt">
  <div class="kjv">KING JAMES ONLY</div>
  <div class="free">FREE</div>
  <div class="app">BIBLE APP</div>
  <div class="church">for your church</div>
  <div class="pills"><span>Read</span><span>Study</span><span>Memorize</span><span>Share</span></div>
</div>
<div class="cross">✝ fbckjv.app/KJVBible</div>
</body></html>
