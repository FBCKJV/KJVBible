name: Daily Verse of the Day

on:
  schedule:
    # 8:00 AM Eastern Time (EST = UTC-5, adjust to UTC-4 during EDT)
    # Change to '0 12 * * *' during daylight saving time (Mar–Nov)
    - cron: '0 13 * * *'
  workflow_dispatch:   # Allows manual trigger from the Actions tab for testing

jobs:
  send-verse:
    runs-on: ubuntu-latest

    steps:
      - name: Calculate today's verse and send notification
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          ONESIGNAL_APP_ID: "2899d3fb-9085-48be-8d7f-a315e564ecda"
        run: |
          # ── Match the app's VOD rotation exactly ──
          # App formula: Math.floor(Date.now() / 86400000) % VOD.length
          DAYS_SINCE_EPOCH=$(( $(date +%s) / 86400 ))
          VOD_COUNT=15
          IDX=$(( DAYS_SINCE_EPOCH % VOD_COUNT ))

          # VOD list — must match const VOD in index.html exactly
          BOOKS=("John" "Psalms" "Romans" "Philippians" "Proverbs" "Isaiah" "Matthew" "Jeremiah" "Romans" "Ephesians" "Hebrews" "Psalms" "John" "Matthew" "Psalms")
          CHAPTERS=(3 23 8 4 3 40 5 29 12 2 11 46 14 6 119)
          VERSES=(16 1 28 13 5 31 4 11 2 8 1 1 6 33 105)

          BOOK="${BOOKS[$IDX]}"
          CHAPTER="${CHAPTERS[$IDX]}"
          VERSE="${VERSES[$IDX]}"
          REF="$BOOK $CHAPTER:$VERSE"

          echo "Today's verse: $REF (index $IDX)"

          # ── Fetch verse text from the same Bible API the app uses ──
          BOOK_URL=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$BOOK'))")
          BIBLE_URL="https://raw.githubusercontent.com/aruljohn/Bible-kjv/master/${BOOK_URL}.json"

          echo "Fetching: $BIBLE_URL"
          RESPONSE=$(curl -sf "$BIBLE_URL")

          if [ -z "$RESPONSE" ]; then
            echo "Failed to fetch Bible data"
            exit 1
          fi

          VERSE_TEXT=$(echo "$RESPONSE" | jq -r ".chapters[$((CHAPTER - 1))].verses[$((VERSE - 1))].text")

          if [ -z "$VERSE_TEXT" ] || [ "$VERSE_TEXT" = "null" ]; then
            echo "Could not extract verse text"
            exit 1
          fi

          echo "Verse text: $VERSE_TEXT"

          # ── Send OneSignal push notification ──
          HTTP_STATUS=$(curl -s -o /tmp/onesignal_response.json -w "%{http_code}" \
            -X POST "https://onesignal.com/api/v1/notifications" \
            -H "Authorization: Basic $ONESIGNAL_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"app_id\": \"$ONESIGNAL_APP_ID\",
              \"included_segments\": [\"All\"],
              \"headings\": {\"en\": \"$REF\"},
              \"contents\": {\"en\": \"$VERSE_TEXT\"},
              \"url\": \"https://fbckjv.github.io/KJVBible\",
              \"chrome_web_icon\": \"https://fbckjv.github.io/KJVBible/apple-touch-icon.png\",
              \"ttl\": 86400
            }")

          echo "OneSignal response ($HTTP_STATUS):"
          cat /tmp/onesignal_response.json

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "OneSignal API error"
            exit 1
          fi

          echo "✓ Notification sent: $REF"
